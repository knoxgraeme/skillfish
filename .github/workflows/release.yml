name: Publish to npm

on:
  # Publishing a GitHub release publishes the version already in package.json
  release:
    types: [published]
  # Manual run: optionally bumps the version, tags, publishes, and creates a GitHub release
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (none = publish the current package.json version)'
        type: choice
        options: [patch, minor, major, none]
        default: patch

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Bump version
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" -m "chore: release v%s"
          git push --follow-tags

      - run: npm run build

      - name: Publish
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published to npm. Bump the version and retry."
            exit 1
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch'
        run: gh release create "v$(node -p "require('./package.json').version")" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
